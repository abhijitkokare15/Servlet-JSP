
<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Form for Second Webapp</title>
</head>
<body>

    <h2>Signup Form</h2>

    <form action="./firstservlet" method="post">

        <label for="name">Name:</label>

        <label for="city">City:</label>

    </form>

</body>
</html>
